# Aturan autentikasi PostgreSQL RCIP: SEMUA koneksi wajib username + password (SCRAM-SHA-256),
# termasuk dari dalam container (docker exec ... psql). Tidak ada aturan "trust".
# TYPE  DATABASE  USER  ADDRESS   METHOD
local   all       all             scram-sha-256
host    all       all   0.0.0.0/0 scram-sha-256
host    all       all   ::/0      scram-sha-256
