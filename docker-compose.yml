services:
  postgres:
    image: postgres:16-alpine
    container_name: rcip_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rcip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rcip_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-rcip_db}
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rcip -d rcip_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # minio:
  #   image: minio/minio:latest
    # command: server /data --console-address ":9001"
    # environment:
    #   MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-rcip_minio}
    #   MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-rcip_minio_secret}
    # ports: ["9000:9000", "9001:9001"]
    # volumes: [minio_data:/data]

  api:
    build: .
    # migrasi database dijalankan otomatis setiap api menyala, lalu server dimulai
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file: .env
    volumes: [".:/app"]
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    build: .
    command: celery -A app.worker.celery_app worker --beat --schedule /tmp/celerybeat-schedule --loglevel=info
    env_file: .env
    volumes: [".:/app"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

volumes:
  postgres_data:
  # minio_data:
