# Gerbang CI (TRD §13.6): migrasi + seed + seluruh test (unit, invarian DB, RBAC/SoD, alur end-to-end,
# generator data sintetis + evaluasi AI) dan type-check + build frontend.
name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        # password database CI dibuat per-run (tidak ada kredensial tetap yang tersimpan di repo)
        env: {POSTGRES_USER: rcip, POSTGRES_PASSWORD: "ci-${{ github.run_id }}-${{ github.run_attempt }}", POSTGRES_DB: rcip_db}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rcip -d rcip_db" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: "postgresql+psycopg://rcip:ci-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/rcip_db"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      # pasang Tesseract di server CI; tanpa ini tes OCR otomatis di-skip (FR-RKM-004)
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-ind
      - run: pip install -r requirements.txt
      # rahasia JWT dibuat acak setiap run CI
      - run: python scripts/gen_secret_key.py | grep -E '^JWT_SECRET_KEY=' >> "$GITHUB_ENV"
      - run: alembic upgrade head
      - run: python -m seed.run
      - run: python -m seed.validate
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: npm ci
      - run: npm run build
