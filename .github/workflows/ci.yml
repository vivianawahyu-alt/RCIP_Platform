# Gerbang CI (TRD §13.6): migrasi + seed + seluruh test (unit, invarian DB, RBAC/SoD, alur end-to-end,
# generator data sintetis + evaluasi AI) dan type-check + build frontend.
name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: rcip, POSTGRES_PASSWORD: rcip_dev_password, POSTGRES_DB: rcip_db}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rcip -d rcip_db" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://rcip:rcip_dev_password@localhost:5432/rcip_db
      JWT_SECRET_KEY: ci_only_secret_key_value_with_32_chars_min
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: python -m seed.run
      - run: python -m seed.validate
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: npm ci
      - run: npm run build
